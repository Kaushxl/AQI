<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Air Quality Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Air Quality Monitor</h1>
        <div class="search-box">
            <input type="text" id="city" placeholder="Enter city name..." />
            <button onclick="getAirQuality()">🔍</button>
        </div>

        <div id="result" class="card hidden">
            <div class="card-header">3
                <h2 id="city-name">City</h2>
                <p id="date-time">Date & Time</p>
            </div>
            <div class="aqi-box">
                <h1 id="aqi-value">0</h1>
                <p id="aqi-level">Loading...</p>
            </div>

            <div class="info">
                <div class="info-box">
                    <p>🌡️ Temperature</p>
                    <h3 id="temperature">0°C</h3>
                </div>
                <div class="info-box">
                    <p>💧 Humidity</p>
                    <h3 id="humidity">0%</h3>
                </div>
            </div>

            <h3>Pollutants</h3>
            <div class="pollutants">
                <div class="pollutant-box">
                    <p>PM2.5</p>
                    <h4 id="pm2_5">0 µg/m³</h4>
                </div>
                <div class="pollutant-box">
                    <p>PM10</p>
                    <h4 id="pm10">0 µg/m³</h4>
                </div>
                <div class="pollutant-box">
                    <p>O₃</p>
                    <h4 id="o3">0 µg/m³</h4>
                </div>
                <div class="pollutant-box">
                    <p>NO₂</p>
                    <h4 id="no2">0 µg/m³</h4>
                </div>
            </div>

            <canvas id="airQualityChart"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
